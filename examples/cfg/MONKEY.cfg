; The Secret of Monkey Island -- para dos386.bin (TinyEMU). Va en /roms/dos/dos386cfg/ (el MONKEY.dsk, en /roms/dos/).
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd.
[gamepad]
mouse  = on         ; driver de ratón: la cruceta mueve el puntero
b      = click      ; botón izquierdo: andar / usar el verbo
a      = click2     ; botón derecho: acción por defecto
start  = f5         ; menú de grabar / cargar (si tu consola tiene START)
select = tab        ; pasar la frase que se está diciendo
time   = esc        ; saltar escenas / la intro
