; Prince of Persia -- para dos386.bin (TinyEMU). Va en /cores/dos386/ (el PRINCE.dsk, en /roms/dos/).
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd.
[gamepad]
b      = shift      ; acción: agarrarse / espada / andar con cuidado / beber
a      = up         ; saltar (mantén izquierda/derecha + A = salto largo)
select = space      ; ver el tiempo que queda
repeat = off        ; sin repetición al mantener un botón: el príncipe se atasca mucho menos

; ¿Se atasca de vez en cuando? Para probar si es cosa de la Sound Blaster,
; quita los ; de estas dos líneas: los efectos sonarán por AdLib y altavoz.
;[sblaster]
;sbtype = none
