; Rick Dangerous -- para dos386.bin (TinyEMU). Va junto a RICK.dsk en /roms/dos/.
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd.
; Teclas del juego: O arriba, K abajo, Z izquierda, X derecha, Espacio disparar.
[gamepad]
up     = o
down   = k
left   = z
right  = x
b      = space      ; disparar / dinamita (con abajo) / empezar
a      = space      ; lo mismo que B
time   = esc        ; salir
select = 1          ; en el menú inicial: 1 = EGA

[sblaster]
oplmode = none      ; solo altavoz del PC (los pasos también): sin chip FM -> más memoria
sbtype  = none      ; tampoco usa la Sound Blaster
