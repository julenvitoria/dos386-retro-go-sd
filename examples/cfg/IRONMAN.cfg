; Ironman Super Off Road -- para dos386.bin (TinyEMU). Va en /cores/dos386/ (el IRONMAN.dsk, en /roms/dos/).
; El AUTOEXEC.BAT del disco arranca "GAME /VGA". Opciones: docs/cfg.md del repo dos386-retro-go-sd.
use_cmdtail = true  ; pasar el /VGA al juego

[gamepad]
up     = q          ; las teclas del jugador 1 son Q / A / X / C
down   = a
left   = x
right  = c
b      = q          ; tecla Q del jugador 1 ("Player 1 Press Button" para empezar)
a      = a          ; tecla A del jugador 1
select = n          ; "Are you using a joystick (Y/N)?" -> N
start  = 3          ; "Please select sound" -> 3 = AdLib (2 = altavoz del PC)
;repeat = off       ; quita el ; si no quieres repetición al mantener un botón

; En CGA el juego va más fluido que en VGA. Para probarlo, quita los ; de
; estas dos líneas:
;[autoexec]
;game /cga
