; Commander Keen 4: Secret of the Oracle (shareware 1.4) -- para dos386.bin (TinyEMU).
; Va en /roms/dos/dos386cfg/ (el KEEN4.dsk, en /roms/dos/). Teclas del juego: Ctrl saltar, Alt pogo,
; Espacio disparar, Intro marcador, Esc menú.
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd.

[gamepad]
a      = ctrl       ; saltar
b      = alt        ; pogo
time   = space      ; disparar
start  = enter      ; marcador / aceptar en los menús
select = esc        ; menú (grabar, cargar, sonido...)
; En las consolas sin START/SELECT: Intro y Esc desde el teclado en pantalla (GAME)
