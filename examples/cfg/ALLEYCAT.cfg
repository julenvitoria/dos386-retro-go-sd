; Alley Cat -- para dos386.bin (TinyEMU). Va junto a ALLEYCAT.dsk en /roms/dos/.
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd.
[gamepad]
b      = space      ; empezar / saltar
select = n          ; "Do you want to use a joystick (Y/N)?" -> N
start  = k          ; nivel Kitten (cambia a h, t o a para los otros niveles)

[sblaster]
oplmode = none      ; el juego solo usa el altavoz del PC: sin chip FM -> más memoria
sbtype  = none      ; tampoco usa la Sound Blaster
