; The Secret of Monkey Island (versión VGA en inglés) -- para dos386.bin (TinyEMU).
; Va junto a MONKEY_VGA.dsk en /roms/dos/, con el MISMO nombre.
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd. Teclas: docs/input/06-gamepad-keys.md
[gamepad]
mouse  = on         ; driver de ratón: la cruceta mueve el puntero
b      = click      ; botón izquierdo: andar / usar el verbo elegido
a      = click2     ; botón derecho
start  = f5         ; menú de grabar / cargar / salir
select = tab        ; pasar la frase que se está diciendo
time   = esc        ; saltar escenas
; Espacio = pausa: desde el teclado en pantalla (GAME)

; SONIDO: el juego encuentra solo la AdLib. Esta versión no busca la Sound
; Blaster: su música es FM y sonaría igual (el mismo chip). Para forzar una
; tarjeta, quita los ; de las tres líneas de abajo y deja UNA letra tras
; "monkey":  a = AdLib, i = altavoz del PC (r = Roland: no emulada, sin música)
;[autoexec]
;cd \MONKEY
;monkey a
