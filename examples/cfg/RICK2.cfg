; Rick Dangerous II -- para dos386.bin (TinyEMU). Va en /cores/dos386/ (el RICK2.dsk, en /roms/dos/).
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd.
; GAME OPTIONS: SELECT = tecla 1 (gráficos), START = tecla 2 (sonido: elige
; "2: ADLIB SOUND"), luego B para empezar.
; KEY DEFINITION: cruceta ARRIBA, ABAJO, IZQUIERDA, DERECHA, luego B (disparo)
; y TIME (Esc) para terminar.
[gamepad]
b      = space      ; disparar / empezar
a      = space      ; lo mismo que B
time   = esc        ; terminar la definición de teclas / salir
select = 1          ; GAME OPTIONS: cambiar los gráficos
start  = 2          ; GAME OPTIONS: cambiar el sonido (altavoz / AdLib)

[cpu]
cycles = 800        ; 286 a 8 MHz: la velocidad a la que va bien el juego

; En [autoexec] NO se pueden poner comentarios al final de la línea: lo que
; sigue al programa son sus parámetros (con "sound ; ..." SOUND.COM responde
; "Invalid option" y no se instala). Primero el driver AdLib, después el juego.
[autoexec]
sound
rick2
