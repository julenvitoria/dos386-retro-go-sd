; Loom -- para dos386.bin (TinyEMU). Va en /cores/dos386/ (el LOOM.dsk, en /roms/dos/).
; Opciones del .cfg: docs/cfg.md del repo dos386-retro-go-sd.
[gamepad]
mouse  = on         ; driver de ratón: la cruceta mueve el puntero
b      = click      ; botón izquierdo: seleccionar / tocar notas
a      = click2     ; botón derecho
start  = f5         ; menú de grabar / cargar (si tu consola tiene START)
select = tab        ; tecla Tab
time   = esc        ; saltar escenas
